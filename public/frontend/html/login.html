<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="سجّل الدخول إلى حسابك في منصة ونس.">
  <title>تسجيل الدخول | ونس</title>
  <link rel="stylesheet" href="../css/style.css">
  <script type="module" src="../js/auth.js"></script>
</head>
<body>
  <main class="auth-page">
    <aside class="auth-side">
      <a class="brand" href="../index.html" aria-label="ونس، الصفحة الرئيسية"><span class="brand-mark" aria-hidden="true">ونس</span></a>
      <div>
        <p class="eyebrow">مرحباً بعودتك</p>
        <h1>مكانك الداعم بانتظارك</h1>
        <p>تابع رحلتك في مساحة تهتم براحتك النفسية وتقدّر احتياجاتك.</p>
      </div>
      <blockquote>«طلب الدعم شجاعة، والاستمرار فيه عناية بالنفس.»<cite>فريق ونس</cite></blockquote>
    </aside>

    <section class="auth-main" aria-labelledby="login-title">
      <form class="auth-form" id="login-form" novalidate>
        <p class="eyebrow">ونس يجمعنا</p>
        <h2 id="login-title">تسجيل الدخول</h2>
        <p>أدخل بيانات حسابك للمتابعة.</p>
        <label class="field" for="email">البريد الإلكتروني<input id="email" name="email" type="email" autocomplete="email" required></label>
        <label class="field" for="password">كلمة المرور<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <p class="form-message" id="login-message" role="status" aria-live="polite"></p>
        <button class="button" type="submit">دخول</button>
        <p class="auth-switch">ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
      </form>
    </section>
  </main>
</body>
</html>
